services:
  # Backend FastAPI Service
  - type: web
    name: achievement2linkedin-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: achievement2linkedin-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://achievement2linkedin-frontend.onrender.com
      - key: BACKEND_URL
        value: https://achievement2linkedin-backend.onrender.com
      - key: LINKEDIN_MOCK_MODE
        value: "false"
      - key: AI_MOCK_MODE
        value: "true"
      - key: LINKEDIN_REDIRECT_URI
        value: https://achievement2linkedin-backend.onrender.com/api/v1/linkedin/callback

  # Frontend Next.js Service
  - type: web
    name: achievement2linkedin-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_URL
        value: https://achievement2linkedin-backend.onrender.com

databases:
  # Managed PostgreSQL Database
  - name: achievement2linkedin-db
    region: singapore
    plan: free
    databaseName: achievement2linkedin
