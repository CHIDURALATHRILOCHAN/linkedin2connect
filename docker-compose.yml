version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: achievement2linkedin_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: achievement2linkedin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: achievement2linkedin_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/achievement2linkedin
      - SECRET_KEY=production-secret-key-32-characters-minimum
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:8000
      - AI_MOCK_MODE=true
      - LINKEDIN_MOCK_MODE=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: achievement2linkedin_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
